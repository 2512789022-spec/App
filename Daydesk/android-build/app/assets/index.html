<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f4f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="每日计划">
<title>每日计划</title>
<style>
  /* ============================================================
     每日计划 — 基于 DayDesk（桌面日程平台）数据改编的单文件手机 App
     设计语言沿用 DayDesk：中性灰底 + 克莱因蓝强调，8px 栅格，
     系统字体栈，150ms ease-out 动效。
     ============================================================ */
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --panel2:#eef0f3;
    --text:#101828; --text2:#667085; --text3:#98a2b3;
    --line:#eaecf0; --line2:#d0d5dd;
    --accent:#2F5BFF; --accent-hover:#1e45e0; --accent-soft:#eaefff;
    --danger:#E5484D; --danger-soft:#feecec;
    --pri-high:#E5484D; --pri-mid:#E08700; --pri-low:#12A150;
    --shadow-panel:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
    --shadow-pop:0 8px 24px rgba(16,24,40,.16);
    --radius:12px;
  }
  html[data-theme="dark"]{
    --bg:#0f1115; --panel:#171a21; --panel2:#1f242e;
    --text:#f2f4f7; --text2:#98a2b3; --text3:#667085;
    --line:#262b36; --line2:#364152;
    --accent:#4c74ff; --accent-hover:#6a8bff; --accent-soft:#1c2540;
    --danger:#f16a6e; --danger-soft:#3a2124;
    --shadow-panel:0 1px 2px rgba(0,0,0,.4);
    --shadow-pop:0 8px 24px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif;
    font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
  input,textarea,select{font:inherit;color:inherit}

  /* ---------- 头部 ---------- */
  header{padding:calc(env(safe-area-inset-top) + 20px) 20px 0}
  .head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
  .date-sub{margin-top:2px;font-size:13px;color:var(--text2)}
  .icon-btn{
    width:40px;height:40px;border-radius:10px;flex:none;
    display:flex;align-items:center;justify-content:center;
    color:var(--text2);transition:background .15s ease-out,color .15s ease-out;
  }
  .icon-btn:active{background:var(--panel2)}
  .progress-row{display:flex;align-items:center;gap:12px;margin:14px 0 4px}
  .progress-track{flex:1;height:3px;border-radius:99px;background:var(--line);overflow:hidden}
  .progress-fill{height:100%;width:0;border-radius:99px;background:var(--accent);transition:width .25s ease-out}
  .progress-text{font-size:12px;color:var(--text2);flex:none;font-variant-numeric:tabular-nums}

  /* ---------- 日期条 ---------- */
  .strip-wrap{padding:12px 0 4px}
  #dateStrip{
    display:flex;gap:4px;overflow-x:auto;padding:4px 14px;
    scrollbar-width:none;scroll-behavior:smooth;
  }
  #dateStrip::-webkit-scrollbar{display:none}
  .day{
    flex:none;width:52px;padding:8px 0 10px;border-radius:12px;text-align:center;
    color:var(--text2);transition:background .15s ease-out,color .15s ease-out;
  }
  .day .wd{font-size:11px;line-height:1.4}
  .day .dn{font-size:17px;font-weight:600;line-height:1.5;font-variant-numeric:tabular-nums}
  .day.is-today .dn{color:var(--accent)}
  .day.is-sel{background:var(--accent);color:#fff}
  .day.is-sel .wd{color:rgba(255,255,255,.8)}
  .day.is-sel .dn{color:#fff}
  .day:active:not(.is-sel){background:var(--panel2)}

  /* ---------- 主体 ---------- */
  main{flex:1;padding:4px 16px calc(env(safe-area-inset-bottom) + 108px)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-panel);overflow:hidden}
  .section-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 4px 8px;
  }
  .section-title{font-size:12px;font-weight:600;color:var(--text2);letter-spacing:.02em}
  .section-action{font-size:12px;font-weight:500;color:var(--accent)}
  .section-action:active{opacity:.7}
  .hidden{display:none !important}

  /* 任务行 */
  .task{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:54px;border-bottom:1px solid var(--line)}
  .task:last-child{border-bottom:0}
  .check{
    flex:none;width:26px;height:26px;border-radius:50%;
    border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;
    color:#fff;transition:background .15s ease-out,border-color .15s ease-out,transform .15s ease-out;
  }
  .check svg{width:14px;height:14px;opacity:0;transform:scale(.5);transition:opacity .15s ease-out,transform .15s ease-out}
  .check:active{transform:scale(.88)}
  .task.is-done .check{background:var(--accent);border-color:var(--accent)}
  .task.is-done .check svg{opacity:1;transform:scale(1)}
  .task-body{flex:1;min-width:0;padding:14px 0}
  .task-title{display:block;font-size:15px;word-break:break-word;transition:color .15s ease-out}
  .task.is-done .task-title{color:var(--text3);text-decoration:line-through;text-decoration-color:var(--text3)}
  .task-meta{display:flex;align-items:center;gap:8px;margin-top:2px}
  .tag-chip{font-size:11px;color:var(--text2);background:var(--panel2);border-radius:6px;padding:1px 7px;line-height:1.6}
  .task-note{font-size:12px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
  .pri-dot{flex:none;width:7px;height:7px;border-radius:50%}
  .pri-high{background:var(--pri-high)} .pri-medium{background:var(--pri-mid)} .pri-low{background:var(--pri-low)}
  .task:active{background:var(--panel2)}

  /* 顺延区 */
  .overdue .task{min-height:50px}
  .overdue .task-title{font-size:14px}
  .carry-btn{flex:none;font-size:12px;font-weight:500;color:var(--accent);padding:8px 2px 8px 12px}
  .carry-btn:active{opacity:.7}

  /* 已完成折叠 */
  .done-toggle{display:flex;align-items:center;gap:6px;padding:12px 4px;font-size:12px;font-weight:600;color:var(--text2)}
  .done-toggle svg{width:12px;height:12px;transition:transform .15s ease-out}
  .done-toggle.open svg{transform:rotate(180deg)}

  /* 空状态 */
  .empty{padding:52px 24px;text-align:center;color:var(--text2)}
  .empty .empty-icon{width:44px;height:44px;margin:0 auto 12px;color:var(--line2)}
  .empty .t1{font-size:14px;font-weight:500}
  .empty .t2{font-size:12px;color:var(--text3);margin-top:4px}
  .empty .t1 .ok{color:var(--accent)}

  /* ---------- 底部输入条 ---------- */
  .composer{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    display:flex;justify-content:center;
    background:var(--bg);
    background:color-mix(in srgb,var(--bg) 86%,transparent);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);
  }
  .composer-inner{display:flex;align-items:center;gap:10px;width:100%;max-width:528px}
  #newTask{
    flex:1;height:44px;border:1px solid transparent;border-radius:22px;outline:none;
    background:var(--panel2);padding:0 18px;font-size:16px;color:var(--text);
    transition:border-color .15s ease-out,background .15s ease-out;
  }
  #newTask::placeholder{color:var(--text3)}
  #newTask:focus{border-color:var(--accent);background:var(--panel)}
  #btnAdd{
    flex:none;width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;
    transition:transform .15s ease-out,background .15s ease-out;
  }
  #btnAdd:active{transform:scale(.92);background:var(--accent-hover)}
  #btnAdd svg{width:22px;height:22px}

  /* ---------- 底部弹层 ---------- */
  .mask{
    position:fixed;inset:0;z-index:40;background:rgba(16,24,40,.42);
    opacity:0;pointer-events:none;transition:opacity .2s ease-out;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .mask.open{opacity:1;pointer-events:auto}
  .sheet{
    width:100%;max-width:560px;max-height:86dvh;overflow-y:auto;
    background:var(--panel);border-radius:16px 16px 0 0;box-shadow:var(--shadow-pop);
    padding:8px 20px calc(env(safe-area-inset-bottom) + 20px);
    transform:translateY(100%);transition:transform .22s ease-out;
  }
  .mask.open .sheet{transform:translateY(0)}
  .handle{width:36px;height:4px;border-radius:99px;background:var(--line2);margin:6px auto 14px}
  .sheet h2{margin:0 0 16px;font-size:17px;font-weight:600}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:6px}
  .field input[type=text],.field textarea,.field input[type=date]{
    width:100%;border:1px solid var(--line2);border-radius:10px;background:var(--panel);
    padding:11px 14px;font-size:16px;outline:none;transition:border-color .15s ease-out;
  }
  .field input:focus,.field textarea:focus{border-color:var(--accent)}
  .field textarea{resize:none;min-height:64px;font-size:15px}
  input[type=date]{color-scheme:light}
  html[data-theme="dark"] input[type=date]{color-scheme:dark}
  .seg{display:flex;background:var(--panel2);border-radius:9px;padding:2px;gap:2px}
  .seg button{
    flex:1;padding:7px 0;border-radius:7px;font-size:13px;font-weight:500;color:var(--text2);
    transition:background .15s ease-out,color .15s ease-out,box-shadow .15s ease-out;
  }
  .seg button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow-panel)}
  .row2{display:flex;gap:12px}
  .row2 .field{flex:1}
  .sheet-actions{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
  .btn{padding:11px 18px;border-radius:10px;font-size:14px;font-weight:600;transition:opacity .15s ease-out,transform .15s ease-out}
  .btn:active{transform:scale(.97);opacity:.85}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-ghost-danger{color:var(--danger)}
  .btn-danger{background:var(--danger);color:#fff}
  .list-btn{
    display:flex;align-items:center;justify-content:space-between;width:100%;
    padding:14px 2px;border-bottom:1px solid var(--line);font-size:15px;
  }
  .list-btn:last-of-type{border-bottom:0}
  .list-btn:active{opacity:.7}
  .list-btn.danger{color:var(--danger)}

  /* ---------- Toast ---------- */
  #toast{
    position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);z-index:60;
    transform:translate(-50%,8px);opacity:0;pointer-events:none;
    display:flex;align-items:center;gap:4px;
    background:#101828;color:#fff;font-size:13px;border-radius:99px;padding:9px 8px 9px 16px;
    box-shadow:var(--shadow-pop);transition:opacity .18s ease-out,transform .18s ease-out;
    max-width:calc(100vw - 48px);white-space:nowrap;
  }
  html[data-theme="dark"] #toast{background:#f2f4f7;color:#101828}
  #toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  #toastAction{color:#8fa7ff;font-weight:600;padding:4px 10px;border-radius:99px}
  html[data-theme="dark"] #toastAction{color:#2F5BFF}
  #toastAction:active{opacity:.7}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition:none !important;animation:none !important;scroll-behavior:auto !important}
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="head-row">
      <div>
        <h1 id="dateTitle">—</h1>
        <div class="date-sub" id="dateSub">—</div>
      </div>
      <button class="icon-btn" id="btnSettings" aria-label="设置">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.65 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.08A1.7 1.7 0 0 0 10.12 3V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.08a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51.88z"/></svg>
      </button>
    </div>
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-text" id="progressText"></span>
    </div>
  </header>

  <div class="strip-wrap"><nav id="dateStrip" aria-label="选择日期"></nav></div>

  <main>
    <!-- 未完成顺延（仅今天视图显示） -->
    <section id="overdueSection" class="hidden">
      <div class="section-head">
        <span class="section-title" id="overdueTitle">未完成顺延</span>
        <button class="section-action" id="btnCarryAll">全部移到今天</button>
      </div>
      <div class="card overdue"><ul id="overdueList" style="list-style:none;margin:0;padding:0"></ul></div>
    </section>

    <!-- 当日任务 -->
    <section>
      <div class="section-head" id="todayHead" style="padding-top:16px">
        <span class="section-title" id="listTitle">今日任务</span>
      </div>
      <div class="card">
        <ul id="taskList" style="list-style:none;margin:0;padding:0"></ul>
        <div class="empty hidden" id="emptyState"></div>
      </div>
      <div id="doneWrap" class="hidden">
        <button class="done-toggle" id="doneToggle" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          <span id="doneToggleText">已完成</span>
        </button>
        <div class="card hidden" id="doneCard"><ul id="doneList" style="list-style:none;margin:0;padding:0"></ul></div>
      </div>
    </section>
  </main>

  <footer class="composer">
    <div class="composer-inner">
      <input id="newTask" type="text" placeholder="添加任务，回车确认" autocomplete="off" enterkeyhint="done">
      <button id="btnAdd" aria-label="添加任务">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </footer>

  <!-- 编辑弹层 -->
  <div class="mask" id="editMask">
    <div class="sheet" role="dialog" aria-label="编辑任务">
      <div class="handle"></div>
      <h2>编辑任务</h2>
      <div class="field">
        <label for="editTitle">标题</label>
        <input type="text" id="editTitle" maxlength="100">
      </div>
      <div class="field">
        <label for="editNotes">备注</label>
        <textarea id="editNotes" maxlength="300" rows="2" placeholder="补充说明（可选）"></textarea>
      </div>
      <div class="row2">
        <div class="field">
          <label>优先级</label>
          <div class="seg" id="editPri">
            <button data-pri="low">低</button>
            <button data-pri="medium">中</button>
            <button data-pri="high">高</button>
          </div>
        </div>
        <div class="field">
          <label for="editDate">日期</label>
          <input type="date" id="editDate">
        </div>
      </div>
      <div class="field hidden" id="editTagField">
        <label>分类</label>
        <div><span class="tag-chip" id="editTag"></span></div>
      </div>
      <div class="sheet-actions">
        <button class="btn btn-ghost-danger" id="btnDelete">删除任务</button>
        <button class="btn btn-primary" id="btnEditDone">完成</button>
      </div>
    </div>
  </div>

  <!-- 设置弹层 -->
  <div class="mask" id="settingsMask">
    <div class="sheet" role="dialog" aria-label="设置">
      <div class="handle"></div>
      <h2>设置</h2>
      <div class="field">
        <label>外观</label>
        <div class="seg" id="themeSeg">
          <button data-theme-opt="system">跟随系统</button>
          <button data-theme-opt="light">浅色</button>
          <button data-theme-opt="dark">深色</button>
        </div>
      </div>
      <div style="margin-top:4px">
        <button class="list-btn" id="btnExport">
          <span>导出备份</span>
        </button>
        <button class="list-btn" id="btnCopy">
          <span>复制到剪贴板</span>
        </button>
        <button class="list-btn" id="btnImport">
          <span>导入备份</span>
        </button>
        <button class="list-btn danger" id="btnClear">
          <span>清空全部数据</span>
        </button>
      </div>
      <input type="file" id="importFile" accept=".json,application/json" class="hidden">
    </div>
  </div>

  <div id="toast"><span id="toastText"></span><button id="toastAction" class="hidden">撤销</button></div>
</div>

/* ================= 常量与状态 ================= */
const STORE_KEY = 'dayplan.v1';
const WD = ['日','一','二','三','四','五','六'];
const PRI_W = { high: 0, medium: 1, low: 2 };
const $ = (id) => document.getElementById(id);

let state = { tasks: [], settings: { theme: 'system' } };
let selectedDate = todayStr();
let showDone = false;
let editingId = null;
let lastDeleted = null;
let toastTimer = null;

/* ================= 日期工具 ================= */
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function addDays(iso, n){
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d + n);
  return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
}
function weekday(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y,m-1,d).getDay(); }
function fmtTitle(iso){
  const [,m,d] = iso.split('-').map(Number);
  return m + '月' + d + '日';
}
function relLabel(iso){
  const t = todayStr();
  if (iso === t) return '今天';
  if (iso === addDays(t,1)) return '明天';
  if (iso === addDays(t,-1)) return '昨天';
  return '';
}

/* ================= 存取 ================= */
function load(){
  let raw = null;
  try { raw = localStorage.getItem(STORE_KEY); } catch(e){}
  if (raw){
    try {
      const s = JSON.parse(raw);
      state.tasks = Array.isArray(s.tasks) ? s.tasks.map(normalizeTask) : [];
      state.settings = Object.assign({ theme:'system' }, s.settings || {});
      return;
    } catch(e){}
  }
  // 首次运行：写入从 daydesk 提取的真实任务
  state.tasks = SEED.map(normalizeTask);
  save();
}
function save(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){}
}
function normalizeTask(t){
  return {
    id: String(t.id || genId()),
    title: String(t.title || '未命名任务'),
    notes: String(t.notes || ''),
    date: /^\d{4}-\d{2}-\d{2}$/.test(t.date || '') ? t.date : todayStr(),
    priority: ['low','medium','high'].includes(t.priority) ? t.priority : null,
    tag: t.tag ? String(t.tag) : null,
    done: !!t.done,
    completedAt: t.completedAt ? String(t.completedAt) : null,
    createdAt: t.createdAt || new Date().toISOString(),
    updatedAt: t.updatedAt || new Date().toISOString(),
  };
}
function genId(){
  return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}
function byId(id){ return state.tasks.find(t => t.id === id); }

/* ================= 主题 ================= */
const mq = window.matchMedia('(prefers-color-scheme: dark)');
function systemPrefersDark(){
  // 安卓 WebView 中 prefers-color-scheme 可能不反映系统设置，优先问原生桥
  try { if (window.AndroidBridge && window.AndroidBridge.isSystemDark()) return true; } catch(e){}
  return mq.matches;
}
function applyTheme(){
  const mode = state.settings.theme;
  const dark = mode === 'dark' || (mode === 'system' && systemPrefersDark());
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', dark ? '#0f1115' : '#f4f5f7');
}
mq.addEventListener('change', () => { if (state.settings.theme === 'system') applyTheme(); });

/* ================= 渲染 ================= */
function render(){
  renderHeader();
  renderStrip();
  renderOverdue();
  renderList();
  renderProgress();
}

function renderHeader(){
  const rel = relLabel(selectedDate);
  $('dateTitle').textContent = fmtTitle(selectedDate);
  $('dateSub').textContent = '星期' + WD[weekday(selectedDate)] + (rel ? ' · ' + rel : '');
  $('listTitle').textContent = rel || (selectedDate > todayStr() ? '计划任务' : '任务');
}

function renderStrip(){
  const nav = $('dateStrip');
  const t = todayStr();
  const start = [addDays(t, -7), selectedDate].sort()[0];
  const end = [addDays(t, 13), selectedDate].sort()[1];
  nav.textContent = '';
  for (let iso = start; iso <= end; iso = addDays(iso,1)){
    const b = document.createElement('button');
    b.className = 'day';
    if (iso === t) b.classList.add('is-today');
    if (iso === selectedDate) b.classList.add('is-sel');
    b.innerHTML = '<div class="wd">周' + WD[weekday(iso)] + '</div><div class="dn">' + Number(iso.slice(8,10)) + '</div>';
    b.addEventListener('click', () => { selectedDate = iso; render(); });
    nav.appendChild(b);
    if (iso === selectedDate) requestAnimationFrame(() => b.scrollIntoView({ block:'nearest', inline:'center' }));
  }
}

function tasksOf(iso){ return state.tasks.filter(t => t.date === iso); }
function overdueTasks(){
  const t = todayStr();
  return state.tasks.filter(x => !x.done && x.date < t).sort((a,b) => a.date.localeCompare(b.date) || a.createdAt.localeCompare(b.createdAt));
}

function renderProgress(){
  const list = tasksOf(selectedDate);
  const done = list.filter(x => x.done).length;
  $('progressFill').style.width = list.length ? Math.round(done / list.length * 100) + '%' : '0';
  $('progressText').textContent = list.length ? done + '/' + list.length + ' 已完成' : '';
}

function renderOverdue(){
  const sec = $('overdueSection');
  const list = overdueTasks();
  const isToday = selectedDate === todayStr();
  sec.classList.toggle('hidden', !isToday || list.length === 0);
  if (!isToday || !list.length) return;
  $('overdueTitle').textContent = '未完成顺延 · ' + list.length;
  const ul = $('overdueList');
  ul.textContent = '';
  for (const task of list){
    const li = document.createElement('li');
    li.className = 'task';
    const body = document.createElement('div');
    body.className = 'task-body';
    const title = document.createElement('span');
    title.className = 'task-title';
    title.textContent = task.title;
    body.appendChild(title);
    if (task.date !== todayStr()){
      const meta = document.createElement('div');
      meta.className = 'task-meta';
      const d = document.createElement('span');
      d.className = 'task-note';
      d.textContent = fmtTitle(task.date) + ' · 星期' + WD[weekday(task.date)];
      meta.appendChild(d);
      body.appendChild(meta);
    }
    const btn = document.createElement('button');
    btn.className = 'carry-btn';
    btn.textContent = '移到今天';
    btn.addEventListener('click', () => carryOver([task.id]));
    li.appendChild(body);
    li.appendChild(btn);
    ul.appendChild(li);
  }
}

function taskRow(task, opts){
  const li = document.createElement('li');
  li.className = 'task' + (task.done ? ' is-done' : '');
  li.dataset.id = task.id;

  const check = document.createElement('button');
  check.className = 'check';
  check.setAttribute('role','checkbox');
  check.setAttribute('aria-checked', task.done ? 'true' : 'false');
  check.setAttribute('aria-label', task.done ? '标记未完成' : '标记完成');
  check.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-11"/></svg>';
  check.addEventListener('click', (e) => { e.stopPropagation(); toggleDone(task.id); });

  const body = document.createElement('div');
  body.className = 'task-body';
  const title = document.createElement('span');
  title.className = 'task-title';
  title.textContent = task.title;
  body.appendChild(title);
  if (task.tag || task.notes){
    const meta = document.createElement('div');
    meta.className = 'task-meta';
    if (task.tag){
      const chip = document.createElement('span');
      chip.className = 'tag-chip';
      chip.textContent = task.tag;
      meta.appendChild(chip);
    }
    if (task.notes){
      const note = document.createElement('span');
      note.className = 'task-note';
      note.textContent = task.notes;
      meta.appendChild(note);
    }
    if (meta.childNodes.length) body.appendChild(meta);
  }
  body.addEventListener('click', () => openEdit(task.id));

  li.appendChild(check);
  li.appendChild(body);
  if (task.priority){
    const dot = document.createElement('span');
    dot.className = 'pri-dot pri-' + task.priority;
    dot.title = { high:'高优先级', medium:'中优先级', low:'低优先级' }[task.priority];
    li.appendChild(dot);
  }
  return li;
}

function renderList(){
  const ul = $('taskList');
  const doneUl = $('doneList');
  const empty = $('emptyState');
  const doneWrap = $('doneWrap');
  ul.textContent = ''; doneUl.textContent = '';

  const all = tasksOf(selectedDate);
  const undone = all.filter(x => !x.done).sort((a,b) =>
    (PRI_W[a.priority] ?? 3) - (PRI_W[b.priority] ?? 3) || a.createdAt.localeCompare(b.createdAt));
  const done = all.filter(x => x.done).sort((a,b) => String(a.completedAt).localeCompare(String(b.completedAt)));

  for (const t of undone) ul.appendChild(taskRow(t));

  // 空状态
  empty.classList.toggle('hidden', all.length > 0);
  if (all.length === 0){
    const past = selectedDate < todayStr();
    empty.innerHTML = '';
    const icon = document.createElement('div');
    icon.className = 'empty-icon';
    icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>';
    const t1 = document.createElement('div');
    t1.className = 't1';
    t1.textContent = past ? '这一天没有任务' : '今天还没有安排';
    const t2 = document.createElement('div');
    t2.className = 't2';
    t2.textContent = past ? '换个日期看看，或从下方添加' : '从下方输入框添加第一条任务';
    empty.appendChild(icon); empty.appendChild(t1); empty.appendChild(t2);
  }

  // 已完成折叠区
  doneWrap.classList.toggle('hidden', done.length === 0);
  if (done.length){
    $('doneToggleText').textContent = '已完成 · ' + done.length;
    $('doneToggle').classList.toggle('open', showDone);
    $('doneCard').classList.toggle('hidden', !showDone);
    if (showDone) for (const t of done) doneUl.appendChild(taskRow(t));
  }

  // 全部完成提示
  if (all.length > 0 && undone.length === 0){
    const t1 = document.createElement('div');
    t1.className = 't1';
    t1.innerHTML = '<span class="ok">✓ </span>今日任务已全部完成';
    empty.classList.remove('hidden');
    empty.textContent = '';
    empty.appendChild(t1);
  }
}

/* ================= 动作 ================= */
function toggleDone(id){
  const t = byId(id);
  if (!t) return;
  t.done = !t.done;
  t.completedAt = t.done ? new Date().toISOString() : null;
  t.updatedAt = new Date().toISOString();
  save();
  render();
}
function carryOver(ids){
  const t = todayStr();
  let n = 0;
  for (const id of ids){
    const task = byId(id);
    if (task && !task.done){ task.date = t; task.updatedAt = new Date().toISOString(); n++; }
  }
  if (!n) return;
  save(); render();
  toast('已移 ' + n + ' 项到今天');
}
function addTask(){
  const input = $('newTask');
  const title = input.value.trim();
  if (!title){ input.focus(); return; }
  state.tasks.push(normalizeTask({
    id: genId(), title,
    date: selectedDate,
    createdAt: new Date().toISOString(),
  }));
  save();
  input.value = '';
  input.focus();
  render();
}
function deleteTask(id){
  const idx = state.tasks.findIndex(t => t.id === id);
  if (idx < 0) return;
  lastDeleted = { task: state.tasks[idx], index: idx };
  state.tasks.splice(idx, 1);
  save();
  closeSheet($('editMask'));
  render();
  toast('已删除「' + (lastDeleted.task.title.length > 8 ? lastDeleted.task.title.slice(0,8) + '…' : lastDeleted.task.title) + '」', () => {
    state.tasks.splice(Math.min(lastDeleted.index, state.tasks.length), 0, lastDeleted.task);
    lastDeleted = null;
    save(); render();
  });
}

/* ================= 弹层 ================= */
function openSheet(mask){ mask.classList.add('open'); }
function closeSheet(mask){ mask.classList.remove('open'); }
document.querySelectorAll('.mask').forEach(m => {
  m.addEventListener('click', (e) => { if (e.target === m) closeSheet(m); });
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') document.querySelectorAll('.mask.open').forEach(closeSheet);
});

function openEdit(id){
  const t = byId(id);
  if (!t) return;
  editingId = id;
  $('editTitle').value = t.title;
  $('editNotes').value = t.notes;
  $('editDate').value = t.date;
  $('editTagField').classList.toggle('hidden', !t.tag);
  $('editTag').textContent = t.tag || '';
  $('editPri').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.pri === t.priority));
  openSheet($('editMask'));
}
function applyEdit(fn){
  const t = byId(editingId);
  if (!t) return;
  fn(t);
  t.updatedAt = new Date().toISOString();
  save(); render();
}

/* ================= Toast ================= */
function toast(text, onAction){
  const el = $('toast'), act = $('toastAction');
  $('toastText').textContent = text;
  if (onAction){
    act.classList.remove('hidden');
    act.onclick = () => { onAction(); hideToast(); };
  } else {
    act.classList.add('hidden');
    act.onclick = null;
  }
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 2600);
}
function hideToast(){ $('toast').classList.remove('show'); }

/* ================= 导出 / 导入 ================= */
function exportPayload(){
  return JSON.stringify({ app:'每日计划', schemaVersion:1, exportedAt:new Date().toISOString(), tasks: state.tasks }, null, 2);
}
function doExport(){
  const payload = exportPayload();
  const name = '每日计划备份-' + todayStr().replaceAll('-','') + '.json';
  // 安卓 App：交给原生写入系统「下载」目录
  if (window.AndroidBridge && window.AndroidBridge.exportJson){
    try { window.AndroidBridge.exportJson(name, payload); return; } catch(e){}
  }
  const blob = new Blob([payload], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function doImport(file){
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      const arr = Array.isArray(data) ? data : data.tasks;
      if (!Array.isArray(arr) || !arr.length) throw new Error('empty');
      const tasks = arr.map(normalizeTask).filter(t => t.title && t.date);
      if (!tasks.length) throw new Error('invalid');
      if (!confirm('导入将替换当前全部 ' + state.tasks.length + ' 条任务，共导入 ' + tasks.length + ' 条。确定继续吗？')) return;
      state.tasks = tasks;
      save(); render();
      closeSheet($('settingsMask'));
      toast('已导入 ' + tasks.length + ' 条任务');
    } catch(e){
      alert('导入失败：文件不是有效的每日计划备份。');
    }
  };
  reader.readAsText(file, 'utf-8');
}

/* ================= 事件绑定 ================= */
$('btnAdd').addEventListener('click', addTask);
$('newTask').addEventListener('keydown', (e) => { if (e.key === 'Enter') addTask(); });

$('btnCarryAll').addEventListener('click', () => carryOver(overdueTasks().map(t => t.id)));

$('doneToggle').addEventListener('click', () => { showDone = !showDone; renderList(); });

$('btnSettings').addEventListener('click', () => {
  $('themeSeg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.themeOpt === state.settings.theme));
  openSheet($('settingsMask'));
});
$('themeSeg').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  state.settings.theme = b.dataset.themeOpt;
  save(); applyTheme();
  $('themeSeg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
});

$('editTitle').addEventListener('input', (e) => {
  const v = e.target.value.trim();
  if (v) applyEdit(t => { t.title = v; });
});
$('editNotes').addEventListener('input', (e) => applyEdit(t => { t.notes = e.target.value; }));
$('editDate').addEventListener('change', (e) => {
  if (/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)) applyEdit(t => { t.date = e.target.value; });
});
$('editPri').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  applyEdit(t => { t.priority = t.priority === b.dataset.pri ? null : b.dataset.pri; });
  const t = byId(editingId);
  $('editPri').querySelectorAll('button').forEach(x => x.classList.toggle('on', !!t && x.dataset.pri === t.priority));
});
$('btnEditDone').addEventListener('click', () => closeSheet($('editMask')));
$('btnDelete').addEventListener('click', () => {
  const t = byId(editingId);
  if (t && confirm('删除任务「' + t.title + '」？')) deleteTask(editingId);
});

$('btnExport').addEventListener('click', doExport);
$('btnCopy').addEventListener('click', async () => {
  const payload = exportPayload();
  // 安卓 App：走原生剪贴板
  if (window.AndroidBridge && window.AndroidBridge.copyText){
    try {
      window.AndroidBridge.copyText(payload);
      toast('备份已复制到剪贴板');
      return;
    } catch(e){}
  }
  try {
    await navigator.clipboard.writeText(payload);
    toast('备份已复制到剪贴板');
  } catch(e){
    const ta = document.createElement('textarea');
    ta.value = payload;
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand && document.execCommand('copy');
    ta.remove();
    toast(ok ? '备份已复制到剪贴板' : '复制失败，请使用「导出备份」');
  }
});
$('btnImport').addEventListener('click', () => $('importFile').click());
$('importFile').addEventListener('change', (e) => {
  if (e.target.files && e.target.files[0]) doImport(e.target.files[0]);
  e.target.value = '';
});
$('btnClear').addEventListener('click', () => {
  if (confirm('确定清空全部 ' + state.tasks.length + ' 条任务吗？此操作不可撤销。')){
    state.tasks = [];
    save(); render();
    closeSheet($('settingsMask'));
    toast('已清空全部数据');
  }
});

/* ================= 启动与跨天刷新 ================= */
load();
applyTheme();
render();

let lastToday = todayStr();
setInterval(() => {
  const t = todayStr();
  if (t !== lastToday){ lastToday = t; render(); }
}, 30000);
document.addEventListener('visibilitychange', () => {
  const t = todayStr();
  if (!document.hidden && t !== lastToday){ lastToday = t; render(); }
});
</script>
